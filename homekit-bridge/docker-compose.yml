services:
  homekit-bridge:
    build: .
    # Linux: host networking is required for mDNS (Bonjour) discovery + HAP.
    # On Docker Desktop (macOS/Windows), remove `network_mode: host` and use:
    #   ports:
    #     - "3000:3000"
    # then discovery may fail -> see README for the static-IP fallback.
    network_mode: host
    environment:
      HOMEBRIDGE_PIN: "${HOMEBRIDGE_PIN:?set HOMEBRIDGE_PIN in your environment}"
      PORT: "3000"
      # HTTP_TOKEN: "change-me"      # optional bearer token
    restart: unless-stopped
